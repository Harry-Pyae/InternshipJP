# ---------------------------------------------------------------------------
# InternshipJP - LOCAL developer configuration EXAMPLE
#
# HOW TO USE
#   1. Copy this file next to it and rename the copy to:
#          application-local.properties
#   2. Fill in your own values.
#   3. Never commit application-local.properties - it is in .gitignore.
#
# Everything here is optional. The application starts with the defaults in
# application.yml if you skip this file entirely.
# ---------------------------------------------------------------------------

# --- Database (XAMPP MariaDB defaults) -------------------------------------
DB_HOST=localhost
DB_PORT=3306
DB_NAME=internshipjp_db
DB_USERNAME=root
# XAMPP normally has a blank root password. Leave the value empty.
DB_PASSWORD=

# --- Frontend / CORS -------------------------------------------------------
FRONTEND_ORIGIN=http://localhost:5173

# --- Uploaded files --------------------------------------------------------
# Relative paths are resolved from the backend/ folder.
UPLOAD_ROOT=./uploads

# --- Test endpoints (/api/test/**) -----------------------------------------
APP_TEST_ENDPOINTS_ENABLED=true

# ===========================================================================
# AI PROVIDER
#
# Two are implemented behind one interface (AiProviderClient), chosen here.
# AiService, the prompts and the whole frontend are identical either way.
#
#   groq     works WITHOUT a VPN. Blocked once a VPN is on.
#   gemini   works WITH a VPN. Blocked without one.
#
# On a machine in Myanmar these are mutually exclusive - each is unreachable
# under the network conditions the other needs. So this is a single choice,
# not a fallback chain: pick the one that matches how you are connected.
#
# For a demo, gemini with the VPN on is the simpler answer - it answers both
# English and Burmese, so there is one provider and one network state.
#
# NOTE: this is a limitation of developing from Myanmar, not of the
# application. Host the backend anywhere outside and both providers work with
# no VPN, for every user.
#
# Leave the key blank to run with no AI at all. /api/test/ai then reports
# "configured: false", and the calculated features - What to learn, Matches,
# the company review and the admin queue - keep working, because they are
# plain Java and never call a provider.
# ===========================================================================
AI_PROVIDER=groq

# --- Groq ------------------------------------------------------------------
# Key from https://console.groq.com (starts gsk_). VPN OFF.
GROQ_API_KEY=
GROQ_MODEL=openai/gpt-oss-120b
GROQ_BASE_URL=https://api.groq.com/openai/v1

# --- Google Gemini ---------------------------------------------------------
# Key from https://aistudio.google.com/apikey (starts AIza). VPN ON.
#
# Do NOT trust the model name below without checking. Providers retire models
# constantly - llama-3.3-70b-versatile was the default here until Groq
# decommissioned it and every request started failing with HTTP 400. Ask your
# own key what it can actually use, with the VPN on:
#
#   $k = "AIza_your_key"
#   (Invoke-RestMethod "https://generativelanguage.googleapis.com/v1beta/models?key=$k").models.name
#
# Pick one that lists generateContent among its supported methods, and skip
# anything ending -preview (can be withdrawn without notice) or aimed at
# another modality (-image, -tts, -transcribe, lyria-*, robotics, computer-use,
# deep-research). Those are not chat models.
#
# gemini-2.5-flash below is a conservative starting point, not a
# recommendation - confirm it against your own list and test it on Burmese.
GEMINI_API_KEY=
GEMINI_MODEL=gemini-3.6-flash
GEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta

# Burmese costs several tokens per syllable, so an allowance that is generous
# in English cuts Burmese off mid-sentence. 3000 is a starting point.
GEMINI_MAX_OUTPUT_TOKENS=3000

# Gemini 2.5+ models reason before answering, and those tokens come out of the
# allowance above.
#
#   -1  do not send the field at all. The only setting every model accepts,
#       and the default. gemini-3.6-flash rejects the whole request with
#       HTTP 400 if it is present.
#    0  ask the model not to reason, leaving the whole budget for the reply.
#       Try this if answers come back truncated; if the model refuses, the
#       client drops the field and retries once on its own.
GEMINI_THINKING_BUDGET=-1

# --- Email OTP -------------------------------------------------------------
# console = the 6-digit code is printed in the backend console (dev only)
# smtp    = a real email is sent using the settings below
MAIL_MODE=console
MAIL_FROM=no-reply@internshipjp.local
# Only needed when MAIL_MODE=smtp
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# --- TOTP secret encryption ------------------------------------------------
# Base64-encoded AES key (16, 24 or 32 raw bytes).
# Generate one with:
#   PowerShell : [Convert]::ToBase64String((1..32 | % {Get-Random -Max 256}))
#   Git Bash   : openssl rand -base64 32
# Empty = TOTP setup is refused (secrets are never stored unencrypted).
TOTP_ENCRYPTION_KEY=

# --- Sample data for testing ------------------------------------------------
# Fills an EMPTY database with demo students, employers, vacancies,
# applications and certificates so you can exercise the API and the AI panels.
#
#   DEMO_DATA_ENABLED=true   seed on the next startup
#   DEMO_DATA_RESET=true     remove the previous demo rows first
#
# Everything it creates is marked: emails end @demo.internshipjp.local and
# companies start with "Demo ". Nothing else is touched. Never enable this on
# a database with real data, and never in production - the prod profile
# refuses it outright.
DEMO_DATA_ENABLED=false
DEMO_DATA_RESET=false

# Fill an account YOU already registered with a realistic profile and skills,
# so the AI assistant has something real to advise you about. The account must
# already exist and be a student. Leave empty to touch nobody.
#   DEMO_DATA_ATTACH_STUDENT=student@example.com
DEMO_DATA_ATTACH_STUDENT=

# --- First administrator account -------------------------------------------
# Set enabled=true, start the backend once, then set it back to false.
BOOTSTRAP_ADMIN_ENABLED=false
BOOTSTRAP_ADMIN_EMAIL=
BOOTSTRAP_ADMIN_PASSWORD=
BOOTSTRAP_ADMIN_NAME=Platform Administrator
