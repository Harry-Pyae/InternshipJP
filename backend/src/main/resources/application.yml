# ---------------------------------------------------------------------------
# InternshipJP - main backend configuration
#
# Rule: no real secret ever lives in this file. Every sensitive value comes
# from an environment variable, or from the git-ignored file
# backend/application-local.properties (see application-local.example.properties).
# ---------------------------------------------------------------------------
spring:
  application:
    name: InternshipJP

  # Optional local overrides. "optional:" means the app still starts if the
  # file does not exist, so a fresh clone runs without any extra setup.
  config:
    import: "optional:file:./application-local.properties"

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:internshipjp_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: InternshipJpPool
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema. Hibernate is only allowed to check that the
    # entities match the tables - it must never create or alter anything.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The database must exist and be EMPTY the first time you start the app.
    # Flyway then creates every table itself.
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      # Certificate uploads. Keep in sync with app.storage.max-file-size-bytes.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: INTERNSHIPJP_SESSION
        http-only: true
        # localhost:5173 and localhost:8080 are the same site (ports are
        # ignored for cookies), so "lax" works in development.
        same-site: lax
        # Set to true only when the whole application is served over HTTPS.
        secure: false
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.internshipjp.backend: INFO
    # Uncomment while debugging SQL:
    # org.hibernate.SQL: DEBUG

# ---------------------------------------------------------------------------
# Application-specific settings (all bound in config/AppProperties.java)
# ---------------------------------------------------------------------------
app:
  # Origin allowed by CORS. The React dev server runs here.
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

  # /api/test/** endpoints. Turn OFF in production.
  test-endpoints-enabled: ${APP_TEST_ENDPOINTS_ENABLED:true}

  storage:
    upload-root: ${UPLOAD_ROOT:./uploads}
    max-file-size-bytes: 5242880
    allowed-mime-types: application/pdf,image/png,image/jpeg
    allowed-extensions: pdf,png,jpg,jpeg

  security:
    # Base64 AES key used to encrypt TOTP secrets at rest.
    # Empty = TOTP setup is refused with a clear error (it is never stored raw).
    totp-encryption-key: ${TOTP_ENCRYPTION_KEY:}

  mail:
    # console = print OTP to the server log (development only)
    # smtp    = send through the configured SMTP server
    mode: ${MAIL_MODE:console}
    from: ${MAIL_FROM:no-reply@internshipjp.local}

  otp:
    length: 6
    expiry-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60

  ai:
    # Which provider answers. One of: groq, gemini.
    #
    # Both implement AiProviderClient, so AiService, the prompts and the whole
    # frontend are identical either way - only this line changes.
    #
    # On a machine in Myanmar the two are mutually exclusive: Groq is blocked
    # once a VPN is on, Gemini is blocked without one. So this is a single
    # choice, not a fallback chain. Deployed outside Myanmar, either works
    # with no VPN at all.
    provider: ${AI_PROVIDER:groq}
    groq:
      api-key: ${GROQ_API_KEY:}
      # Groq retires models regularly - llama-3.3-70b-versatile was
      # decommissioned in 2026 and started returning HTTP 400. Keep this a
      # setting, never a constant, so the fix stays a config change.
      # Check what your key can use:
      #   curl https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      timeout-seconds: 30
      max-output-tokens: 700
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # Google retires models too. Ask your own key what it can use:
      #   https://generativelanguage.googleapis.com/v1beta/models?key=YOUR_KEY
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-seconds: 45
      # Far higher than Groq's 700, for two reasons that compound:
      #
      # 1. BURMESE COSTS MORE TOKENS. Tokenizers are trained mostly on Latin
      #    script; Burmese syllables often take several tokens each. The same
      #    answer can cost three to five times what it costs in English, so a
      #    budget that is generous in English truncates Burmese mid-sentence.
      #    3000 still was not enough - a matches answer in Burmese hit the
      #    limit partway through the second internship - so the default is
      #    8000. Raise it further if answers are still cut off; the truncation
      #    notice in the reply tells you when that happens.
      #
      # 2. GEMINI 2.5+ MODELS THINK FIRST, and those thinking tokens are
      #    charged against this same budget. With 700 the model could spend
      #    most of it reasoning and have almost nothing left to say.
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:8000}
      # -1 (the default) does not send the field at all, which is the only
      # setting every model accepts. gemini-3.6-flash rejects the whole
      # request with HTTP 400 if it is present.
      #
      # 0 asks the model not to reason before answering, leaving the whole
      # token budget for the reply. Try it if answers come back truncated;
      # if the model refuses, the client drops the field and retries once.
      thinking-budget: ${GEMINI_THINKING_BUDGET:-1}

  demo-data:
    # Sample students, employers, vacancies and applications for testing the
    # API. OFF by default and refused under the prod profile - see
    # config/DemoDataSeeder.java.
    enabled: ${DEMO_DATA_ENABLED:false}
    reset: ${DEMO_DATA_RESET:false}
    # Fills an account you already own with a realistic profile and skills, so
    # you can test the assistants as yourself. Empty = leave every account alone.
    attach-student: ${DEMO_DATA_ATTACH_STUDENT:}

  bootstrap-admin:
    # There is no public admin registration endpoint. To create the first
    # administrator, set these in application-local.properties, start the app
    # once, then set enabled back to false.
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_NAME:Platform Administrator}
